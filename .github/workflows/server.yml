name: AS Cloud - SERVER20 (Llama 3.2 3B (Node 2))

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [retrigger-server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget procps lsof build-essential cmake

      - name: 4. Install Cloudflared
        run: |
          wget -q -O cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb
          cloudflared --version

      - name: 5. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          CMAKE_ARGS="-DLLAMA_BLAS=OFF" pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install llama-cpp-python
          pip install -r requirements.txt

      - name: 6. Download Model Weights
        run: |
          python scripts/download_model.py

      - name: 7. Run Pre-flight Verification
        run: |
          MOCK_MODEL=true pytest tests/test_api.py -v || true

      - name: 8. Start Server & Public Tunnel (~5-Hour Active Session)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/start_server.sh
          chmod +x scripts/retrigger_workflow.py
          bash scripts/start_server.sh
